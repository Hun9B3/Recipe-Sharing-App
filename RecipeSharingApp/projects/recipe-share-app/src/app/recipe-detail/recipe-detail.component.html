<div class="flex min-h-screen bg-white">
    <app-sidebar></app-sidebar>

    <main class="flex-1 p-6">
        <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-lg overflow-hidden" *ngIf="recipe">
            <div class="relative h-64 md:h-96">
                <img [src]="recipe.imageUrl" alt="{{ recipe.title }}" class="w-full h-full object-cover">
                <div class="absolute bottom-0 left-0 w-full bg-linear-to-t from-black to-transparent p-6">
                    <h1 class="text-3xl font-bold text-white">{{ recipe.title }}</h1>
                    <div class="flex gap-3 mt-2 text-white text-sm">
                        <span class="bg-green-600 px-2 py-1 rounded">{{ recipe.cuisine }}</span>
                        <span class="bg-blue-600 px-2 py-1 rounded">{{ recipe.dietary }}</span>
                    </div>
                </div>
                <button (click)="toggleFavorite()"
                    class="absolute top-4 right-4 p-3 rounded-full bg-white shadow-md hover:bg-red-50 transition">
                    <i class="fas fa-heart" [ngClass]="{'text-red-500': isFavorite, 'text-gray-300': !isFavorite}"></i>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 p-6">
                <div class="md:col-span-1 bg-gray-50 p-4 rounded-lg h-fit">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Nguyên liệu</h2>
                    <ul class="space-y-3">
                        <li *ngFor="let item of recipe.ingredients" class="flex items-center">
                            <input type="checkbox" id="ing-{{item.ingredient.id}}"
                                class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                            <label for="ing-{{item.ingredient.id}}"
                                class="ml-3 text-gray-700 cursor-pointer select-none">
                                {{ item.amount }} {{ item.ingredient.name }}
                            </label>
                        </li>
                    </ul>
                </div>

                <div class="md:col-span-2">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Hướng dẫn thực hiện</h2>
                    <ol class="list-decimal list-inside space-y-4 text-gray-700">
                        <li *ngFor="let step of parseSteps(recipe.instructions)" class="pl-2">
                            {{ step }}
                        </li>
                    </ol>
                </div>
            </div>
        </div>
    </main>
</div>
